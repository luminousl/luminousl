[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "luminousl"
version = "0.1.0"
description = "Model deployment toolkit for Zdrive platform"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Zdrive Team", email = "team@zdrive.ai"}
]
keywords = ["model", "deployment", "tensorrt", "onnx", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "onnx>=1.12.0",
    "onnx-graphsurgeon>=0.3.0",
    "numpy>=1.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
]
tensorrt = [
    "tensorrt>=8.0",
]
polygraphy = [
    "polygraphy>=0.44.0",
]
ort = [
    "onnxruntime>=1.12.0",
]

[project.scripts]
luminousl = "luminousl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["luminousl*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
