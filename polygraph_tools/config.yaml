input_data_path: ./onnx_sample/data/1765358554.26065 # ./onnx_sample/dummy_inputs.pt #模型输入，若是其他形式输入，可通过修改DataLoader实现
outputs: ["cat"]  # 比较输出的目标；["@all"]: 所有的tensor；["@module_name"]: module_name开头的所有tensor; ["@model_outputs"]: 模型输出;[tensor_name1, tensor_name2]: 目标tensor名称；[]: 默认模型输出;
save_path: v9.1226.onnx_trt_report.csv

onnx:
  onnx_path: ./onnx_sample/TASK01100000110_V8_bevformer_spatial_int8_sim_int8opt_plugin.orin.onnx # onnx模型的地址，必须有
  action: True  # 是否做onnx推理

trt:
  action: True   # 是否做trt推理
  fp16: True
  fp32_layer_list: [] #["/BEV_OD/head1/layers.4/attn/MatMul_3"] # 指定特定层为fp32精度
  plugins: ["./trt_plugins/libinferplugin_v9_x86.so", "./trt_plugins/plugin_trt.so"]
  dynamic_shape: {} #{ranks_depth: [629294, 1258588, 5034352], ranks_feat: [629294, 1258588, 5034352], ranks_bev: [629294, 1258588, 5034352], interval_starts: [8507, 17014, 68056], interval_lengths: [8507, 17014, 68056]}

additional_operation:
  add_input_name_list: [] #["/BEV_OD/head1/layers.0/value_proj_1x1conv/Conv_output_0", "/BEV_OD/head1/layers.0/value_proj_1x1conv_1/Conv_output_0", "/BEV_OD/head1/layers.0/radar_value_proj_1x1conv/Conv_output_0", "/BEV_OD/head1/layers.0/lidar_value_proj_1x1conv/Conv_output_0", "/BEV_OD/head1/layers.0/Concat_6_output_0", "/BEV_OD/head1/layers.0/Concat_5_output_0"] #["/Concat_1_output_0"]  # 需要添加为模型输入的tensor name 列表
  add_input_data_root: ./save_bin_root/onnxruntime_outputs
  save_name_list: [] #["@/TRAFFICLANE_BEV/HybridVecHead/transformer/layers.0"] #["/Concat_1_output_0"]  # 需要保存的输出，支持outputs类似的指定方式，例如"@/group3", "@model_outputs"等
  save_bin_root: ./save_bin_root # 保存输出的目录


